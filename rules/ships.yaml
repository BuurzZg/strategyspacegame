# Ships. Costs are ore; BuildDuration is in ticks (25 per second).
# Fleet capacity: the Forge provides 30. Fighters use 1-2, corvettes 3, frigates 6.

# ------------------------------------------------------------------ mothership
forge:
	Inherits: ^Ship
	Tooltip:
		Name: Forge
		Class: Mothership
		Role: Foundry-city
		Description: A kilometre of furnaces, hangars and crew decks. It builds your fleet. If it falls, so do your people.
	Health:
		HP: 2400000
		Radius: 5400
	Armor:
		Type: capital
	Selectable:
		Radius: 5600
		Priority: 20
	Flight:
		MaxSpeed: 10
		Acceleration: 1
		Deceleration: 1
		TurnSpeed: 1
		PitchSpeed: 1
		MaxPitch: 256
		TurnInPlace: true
		Slip: 240
		ArriveRadius: 160
		Bank: 3
	WithModel:
		Model: forge
	ProductionQueue:
		Type: Forge
		MaxQueue: 10
	LaunchBay:
		Forward: 512
		Side: 1400
		Up: -100
		ExitYaw: 220
		LaunchSpeed: 16
		Clearance: 768
	RallyPoint:
	ProvidesCapacity:
		Amount: 30
	ProvidesPrerequisite:

