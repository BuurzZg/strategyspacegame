# Memories: the progress of a campaign (PLAN.md §4). Thirty-one of them, in five branches, shown
# on the Loom. Once remembered, a memory stays for the whole campaign, in every life. The crew
# wake blank each time; the Forge's drive records keep what Jacob has recovered.
#
#   Name, Text   what it is called, and what the Loom says once it is known
#   Hint         what the Loom says about it before it is known (it shows as a question mark)
#   Kind         knowledge (story, lore, places) or ability (systems, hulls, rooms, options)
#   Branch       origins, skein, forge, fleet or decks
#   Found        an anchor (below, or a drive part's place): it is recovered by cutting into the
#                hulk there. Story and drive memories are found this way and cost nothing
#   Cost, Needs  otherwise it is recalled on the Loom with this many echoes, once the memories
#                it needs are known
#   Blueprint    a blueprint item that also brings it back (a wreck of that hull, a trader)
#   Gives        what it does: radar (the chart's sensors), drive <part> (a Skein Drive part,
#                items.yaml), hull <ship> (the foundry can build it), echoes <n>, open <hazard>,
#                room <room> (it can be built on the deck plan, items.yaml)
#                (its lanes open, hazards.yaml)
#   Echoes       echoes it gives when it comes back
#   Seen         a hazard (hazards.yaml): it can be recalled only once you have been turned away by it
#   By           event: a story event gives it (events/story.yaml), not a place or the Loom
#   Ready        false: its system comes in a later milestone; until then it stays a question mark
#   Status       a ship's system: what the crew call it when it is working (the waking status
#                report lists every one Jacob remembers: "Nothing's working, Captain, except ...")
#
# Anchors: where story memories wait. The generator places each one in its region, a number of
# stitches (Hops) from the wake-up point, and turns that place into the given Type. Clue is the
# radius, in spans, of the circle a clue draws round it on the chart. Edge: true, only at the
# region's outer edge. Near: one of the closest such places to another anchor or drive part.
# Early: placed before the hazard pockets are carved (the Anchorage); the rest come after them.
# Lair: true, the Mainspring's lair (no hulk to cut: the final battle).

Anchors:
	anchorage:
		Name: the Anchorage
		Region: Drift
		Hops: 3-5
		Type: Anchorage
		Early: true
		Clue: 70
		Relic: the station's sealed core
	steward:
		Name: the Steward
		Region: Drift
		Hops: 4-8
		Type: Steward
		Clue: 80
		Relic: the yacht's recording vault
	research:
		Name: the Quiet Lamp
		Region: Middens
		Hops: 0-99
		Type: ResearchHulk
		Clue: 90
		Relic: the hulk's sealed laboratory
	ledger:
		Name: the Tally of Owls
		Region: Middens
		Hops: 0-99
		Type: TallyHulk
		Clue: 90
		Relic: the Moot's old ledgers
	barge:
		Name: the Long Account
		Region: Middens
		Hops: 0-99
		Type: PrisonBarge
		Clue: 90
		Relic: the barge's manifest room
	reliquary:
		Name: the Reliquary of Ninefold
		Region: Hush
		Hops: 0-99
		Type: Reliquary
		Clue: 100
		Relic: an empty reliquary case
	horologe:
		Name: the Meridian Horologe
		Region: Hush
		Hops: 0-99
		Type: Horologe
		Clue: 100
		Relic: the chronometer hall
	tithe:
		Name: the Tithe Barge
		Region: Hush
		Hops: 0-99
		Type: TitheBarge
		Clue: 100
		Relic: the barge's offering deck
	hall:
		Name: the Founding Hall
		Region: Shore
		Hops: 0-99
		Type: FoundingHall
		Clue: 110
		Relic: the Pact's book of names
	lair:
		Name: the Mainspring
		Region: Shore
		Hops: 0-99
		Type: Lair
		Edge: true
		Near: heartstone
		Lair: true
		Clue: 120

# ---------------------------------------------------------------- origins
radar:
	Name: The radar
	Kind: ability
	Branch: origins
	Order: 1
	Found: anchorage
	Gives: radar
	Status: the radar
	Text: The sensor array's long watch. The chart lights up as far as the sensors reach, and deep scans work.
	Hint: The chart is dark. Somewhere there is a way to light it.

emblem:
	Name: The emblem
	Kind: knowledge
	Branch: origins
	Order: 2
	Found: anchorage
	Echoes: 1
	Text: A cross with an orbit drawn through its arms, on the station, on the Forge's own hull plates, on every uniform aboard, and small, on a pendant round a dead woman's neck. A faith and a foundry on one badge. It belonged to a company. It still belongs to us. The station's last dated log is a hundred years of dust deep.
	Hint: A mark on the hull that nobody aboard can explain.

help:
	Name: "We are here to help"
	Kind: knowledge
	Branch: origins
	Order: 3
	Hint: A voice in an old recording, somewhere near the station.
	Found: steward
	Echoes: 1
	Text: Erik Smith, head of the Company, on the day the Anchorage opened. Thin, tired, smiling at a crowd you can't see. "We are here to help." He means it. You can hear that he means it. You can also hear, under the applause, somebody shouting from the back.

owner:
	Name: The old man's ship
	Kind: knowledge
	Branch: origins
	Order: 4
	Hint: Whose ship is this? Something about the people who attack on sight might shake it loose.
	By: event
	Echoes: 1
	Text: The Forge's registry, behind a panel nobody remembered opening: the private ship of Dr. Jacob Smith, retired, grandfather of the Company's chief. You. The havens' "old man with the great ship" is you. One line at the bottom is struck through and sealed: Deck 9.

fray:
	Name: The Fray
	Kind: knowledge
	Branch: origins
	Order: 5
	Hint: Why did we come here at all?
	Found: research
	Echoes: 1
	Text: The Fray: travel through folded space long enough and you come apart, a little at a time, until there is nothing left to come apart. It was killing the Empire. It killed Erik's mother. Ninefold does not fray. Nothing near it ever has. The mission was a cure.

oath:
	Name: The oath
	Kind: knowledge
	Branch: origins
	Order: 6
	Hint: Someone swore to stop us. Someone old enough to remember.
	By: event
	Echoes: 1
	Text: The Lantern Synod swore an oath to guard Ninefold's knot. They told the Knotfolk the Company had come to unpick it, and they broke the mission's work where they could. Erik never explained himself to them. The Deacon who told you this has aged more than a hundred years since he last saw you. You have not aged a day.

afraid:
	Name: "Afraid is cooperative"
	Kind: knowledge
	Branch: origins
	Order: 7
	Hint: The traders smiled at us. Why?
	Found: ledger
	Echoes: 1
	Text: The traders and the raiders who helped the Company were paid in fear. A note in the margin of the Moot's ledger, in a Company hand: "Let them be afraid. Afraid is cooperative." The Ashen Gaunt guided Company ships to their own kin's camps, and were paid for every one.

lists:
	Name: The lists
	Kind: knowledge
	Branch: origins
	Order: 8
	Hint: Names, in a hand you almost know.
	Found: barge
	Echoes: 1
	Text: Names. Clan names, thousands of them, some bought from the Rivet Moot, in a careful hand you almost know. The cages on the Anchorage's lower ring were full. Nothing in the manifest says why. That is somehow the worst of it.

otherhalf:
	Name: The other half
	Kind: knowledge
	Branch: origins
	Order: 9
	Hint: Something you have carried for a very long time.
	Found: reliquary
	Echoes: 1
	Text: Half of a thing, cold and brass-dark, that you carried for most of your life. The Twain. The other half lay here, in the Knotfolk's reliquary, and the case is empty. The "retirement project" was the search. The Company's mission was your way in. The Knotfolk were wrong about the Company. They were right about you.

waking:
	Name: The waking
	Kind: knowledge
	Branch: origins
	Order: 10
	Hint: What woke? The Choir felt something, once.
	By: event
	Echoes: 1
	Text: You stole the other half. When the halves met, everything that keeps time flinched, the Choir say, and something underneath the Wrack woke and began to wind. The Mainspring. It wound the galaxy shut. Whether you knew it would, the Choir do not say. Perhaps they do not know. Perhaps they are being kind.

horologe:
	Name: The Meridian Horologe
	Kind: knowledge
	Branch: origins
	Order: 11
	Hint: What day is it?
	Found: horologe
	Echoes: 1
	Text: The Empire's clock, ticking alone in a cathedral of brass. Official Meridian time, kept to the second for a century and a half. The station's last record and today's date, side by side: one hundred and forty-seven years, three months and fifteen days. Everyone you knew died a long time ago. The date is known now, in every life.

offering:
	Name: The offering
	Kind: knowledge
	Branch: origins
	Order: 12
	Hint: What was the price?
	Found: tithe
	Echoes: 1
	Text: The Company was the demons' hostage: feed the Mainspring, or watch the Anchorage unmade. So its ships took captives from the clans and gave them to it, here, on this barge. On Erik's orders, with you beside him, for years. Erik signed every order and kept every name, believing each one bought the Anchorage another season. Each offering made it stronger.

enough:
	Name: Enough
	Kind: knowledge
	Branch: origins
	Order: 13
	Hint: Who said no?
	Found: hall
	Echoes: 1
	Text: Erik saw it first: the offerings were feeding the thing, not calming it. Every one made the Mainspring stronger. So he refused to send another. He said "enough", to a god, in front of everyone. The Hands fell on the Anchorage, and it burned for three days. Erik held the docks while the evacuation ships got away, and then he did not get away. Every haven out there is alive because of him. The Cinder Pact keep his story, and blame the old man.

truth:
	Name: The whole truth
	Kind: knowledge
	Branch: origins
	Order: 14
	Hint: Deck 9 is sealed. It opens at the Shore, once everything else is remembered.
	By: event
	Echoes: 2
	Text: Deck 9. Your own quarters, sealed from the inside. When everything fell, the Twain stopped time around you and the Forge, and saved you. You did not deserve it. Why it did, and what it is, nobody knows. It sings, very quietly, if you hold it too long. Then it woke you, or something did, a hundred and forty-seven years late. And something has been winding you back ever since, every time you die. The Mainspring wants it back. It is waiting at the Shore.

# ---------------------------------------------------------------- the Skein
coils:
	Name: Threadwound Coils
	Kind: ability
	Branch: skein
	Order: 1
	Found: coils
	Echoes: 1
	Gives: drive coils
	Status: the thread coils
	Text: Spools of thread-metal that hold a stitch open longer. The engineers' hands knew how to wind them before their heads did. The drive reaches the Middens.
	Hint: The drive stitches short. It used to reach further.

lens:
	Name: Stillwater Lens
	Kind: ability
	Branch: skein
	Order: 2
	Found: lens
	Needs: coils
	Echoes: 1
	Gives: drive lens
	Status: the lens
	Text: A lens of something that is not quite glass. Through it, the Veil looks like an open door, and the drive can stitch through it into the Hush.
	Hint: There is a wall of light the drive cannot thread.

spindle:
	Name: Anchor Spindle
	Kind: ability
	Branch: skein
	Order: 3
	Found: spindle
	Needs: lens
	Echoes: 1
	Gives: drive spindle
	Status: the anchor spindle
	Text: The heavy core that keeps a long stitch from fraying. The drive makes long stitches now, out to the Shore.
	Hint: Some gaps are too long to stitch.

heartstone:
	Name: Heartstone
	Kind: ability
	Branch: skein
	Order: 4
	Found: heartstone
	Needs: spindle
	Echoes: 1
	Gives: drive heartstone
	Status: the heartstone
	Text: A warm stone the size of a house, the drive's heart. From the Shore's edge, the Forge can make the final jump.
	Hint: The way out, if there is one.

# ---------------------------------------------------------------- the Forge's systems
shields:
	Name: Shields
	Kind: ability
	Branch: forge
	Order: 1
	Seen: shoals
	Cost: 2
	Gives: open shoals
	Status: the shields
	Text: The shield generators hum awake. The asteroid shoals open.
	Hint: Turned away from a shoal, the engineers can't stop talking about the shields. Two echoes, and someone remembers how they worked.

baffles:
	Name: Heat baffles
	Kind: ability
	Branch: forge
	Order: 2
	Seen: embers
	Cost: 2
	Gives: open embers
	Status: the heat baffles
	Text: The boilers' heat baffles, rebuilt from memory. The ember lanes near Orrin open.
	Hint: Close to the dead star, the hull would cook. Someone once knew how to shed that heat.

rods:
	Name: Lightning rods
	Kind: ability
	Branch: forge
	Order: 3
	Seen: static
	Cost: 2
	Gives: open static
	Status: the lightning rods
	Text: Brass rods along the spine to bleed the storms off. The static fields open.
	Hint: Every needle spins in the storms. There used to be rods for that.

lead:
	Name: Lead-lined decks
	Kind: ability
	Branch: forge
	Order: 4
	Seen: glare
	Cost: 2
	Gives: open glare
	Status: the lead in the decks
	Text: The crew line the decks with lead, and the surgeon stops looking worried. The Glare opens.
	Hint: A light that makes people sick. The old decks had lead in them for a reason.

silent:
	Name: Silent running
	Kind: ability
	Branch: forge
	Order: 5
	Needs: rods
	Cost: 2
	Gives: silent
	Status: silent running
	Text: Baffled stacks, banked boilers, no chatter on the open bands. The Forge goes quiet, and whatever was listening loses it: the Wound's attention falls a little every day, and the Hands only hear the Forge where it fights.
	Hint: Something out there is listening.

# ---------------------------------------------------------------- the fleet
hull-wisp:
	Name: Wisp
	Kind: ability
	Branch: fleet
	Order: 1
	Needs: radar
	Cost: 1
	Gives: hull wisp
	Text: The little scout with the big eyes. The foundry can build Wisps.
	Hint: A scout that sees further than the rest. The radar would help you remember it.

hull-talon:
	Name: Talon
	Kind: ability
	Branch: fleet
	Order: 2
	Blueprint: bp-talon
	Gives: hull talon
	Text: The delta-winged bomber that cracks frigates. The foundry can build Talons.
	Hint: Cut up a wreck of one, or buy its plans.

hull-sabre:
	Name: Sabre
	Kind: ability
	Branch: fleet
	Order: 3
	Blueprint: bp-sabre
	Gives: hull sabre
	Text: A destroyer with torpedoes and two pulse batteries. The foundry can build Sabres.
	Hint: Cut up a wreck of one, or buy its plans.

hull-spindle:
	Name: Spindle
	Kind: ability
	Branch: fleet
	Order: 4
	Blueprint: bp-spindle
	Gives: hull spindle
	Text: The lance frigate that hurts capital hulls from far away. The foundry can build Spindles.
	Hint: Cut up a wreck of one, or buy its plans.

hull-monolith:
	Name: Monolith
	Kind: ability
	Branch: fleet
	Order: 5
	Ready: false
	Hint: Something very large, deep in the Shore.

# ---------------------------------------------------------------- the decks
messhall:
	Name: Mess hall
	Kind: ability
	Branch: decks
	Order: 1
	Cost: 1
	Gives: room messhall
	Text: Long tables and somebody cooking. The engineers remember how the mess hall went together. It can be built on the deck plan, in every life.
	Hint: A place for the crew to eat together.

infirmary:
	Name: Infirmary
	Kind: ability
	Branch: decks
	Order: 2
	Needs: messhall
	Cost: 2
	Gives: room infirmary
	Text: Cots, lamps and clean hands. The surgeon remembers how the infirmary was laid out. It can be built on the deck plan, in every life.
	Hint: Someone used to keep people alive here.

chartroom:
	Name: Chart room
	Kind: ability
	Branch: decks
	Order: 3
	Needs: radar
	Cost: 1
	Gives: room chartroom
	Text: Brass rails and glass, and charts pinned flat. The watch remember the chart room. It can be built on the deck plan, in every life.
	Hint: A room full of maps nobody can read yet.
