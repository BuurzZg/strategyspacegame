# Items: the Skein Drive's four components, blueprints for hulls you cannot build yet, and
# engineering projects (Forge upgrades). The drive's components are remembered, not fitted
# (memories.yaml): once a memory brings one back, the drive has it in every life.
#   Region      where the generator hides it: in a derelict, deep in that region
#   Range       the drive's stitch range becomes this percent of what it was
#   Veil        lets the drive stitch through the Veil's nebula wall
#   FinalJump   the long jump home, from the Shore's edge
#   Install     (projects) what building it costs: Ore, Salvage, Days, and Engineers needed

coils:
	Name: Threadwound Coils
	Kind: drive
	Description: Spools of thread-metal that hold a stitch open longer. The Forge's own snapped on the way in.
	Region: Drift
	Range: 150
	Install:
		Ore: 700
		Salvage: 700
		Days: 2
		Engineers: 10

lens:
	Name: Stillwater Lens
	Kind: drive
	Description: A lens of something that is not quite glass. Through it, the Veil looks like an open door.
	Region: Middens
	Veil: true
	Install:
		Ore: 900
		Salvage: 1300
		Days: 3
		Engineers: 14

spindle:
	Name: Anchor Spindle
	Kind: drive
	Description: The heavy core that keeps a long stitch from fraying. Whoever made this one meant to go a long way.
	Region: Hush
	Range: 134
	Install:
		Ore: 1300
		Salvage: 1900
		Days: 3
		Engineers: 18

heartstone:
	Name: Heartstone
	Kind: drive
	Description: A warm stone the size of a house. The old engineers' notes call it the drive's heart, and are very sure about it.
	Region: Shore
	FinalJump: true
	Install:
		Ore: 1700
		Salvage: 2500
		Days: 4
		Engineers: 20

# Blueprints: a hull you can build once you have one. Found by cutting up wrecks of that hull
# (half its salvage), bought from factions, or given in events. Start lists the hulls you can
# build from the beginning.
Blueprints:
	Start: dart, picket, halberd, gleaner, shearer, skimmer, smelter
bp-talon:
	Name: Talon blueprint
	Kind: blueprint
	Unlocks: talon
	Description: How to build a delta-winged bomber that cracks frigates.
bp-spindle:
	Name: Spindle blueprint
	Kind: blueprint
	Unlocks: spindle
	Description: How to build a lance frigate that hurts capital hulls from far away.
bp-sabre:
	Name: Sabre blueprint
	Kind: blueprint
	Unlocks: sabre
	Description: How to build a destroyer with torpedoes and two pulse batteries.

# Rooms: the Forge's deck plan (PLAN.md §6), built from the Forge panel with ore, salvage, days
# and free engineers. The deck plan has DeckSlots (voyage.yaml) slots; each room takes Slots of
# them (1 unless given; 0 for what goes on the hull or in the hangar). Rooms are physical: they
# are lost with everything else when a life ends, and built again in the next.
#   Capacity (fleet capacity), FoodPct (hydroponics output), SensorPct (sensor range on the
#   chart and on maps), GlimPct (Glim per stitch), HullPct (the Forge's hull), Heal (percent of
#   their hull ships aboard mend each day), BuildPct (foundry speed), ForgeDamagePct (the
#   Forge's own guns), LaunchPct (time between launches from the hangar), Berths (people who
#   can live aboard), Recover (strain levels it takes off each day, on top of one: Strain lists
#   which kinds, or all), MoraleUp (to the morale the crew settle at), CluePct (the size of new
#   clue circles), RepairCostPct (ore and salvage a repair takes), WaterPct (water the crew drink)
#   Requires: another room that must be built first. A memory that Gives "room <id>" must be
#   remembered before it can be built (memories.yaml).
hangar:
	Name: Expanded hangar
	Kind: room
	Description: Gut two cargo decks and fit them as bays. Room for ten more capacity of ships.
	Capacity: 10
	Install:
		Ore: 900
		Salvage: 500
		Days: 4
		Engineers: 16
racks:
	Name: Hydroponic racks
	Kind: room
	Description: Stack the grow beds three high. The hydroponics grow half as much again.
	FoodPct: 150
	Install:
		Ore: 400
		Salvage: 300
		Days: 3
		Engineers: 10
array:
	Name: Long-range array
	Kind: room
	Description: A second sensor dish on the spine. The Forge sees half again as far, on the chart and on maps.
	SensorPct: 150
	Install:
		Ore: 500
		Salvage: 400
		Days: 3
		Engineers: 12
recycler:
	Name: Glim recycler
	Kind: room
	Description: Catch what the Skein spills on every stitch. Stitches cost a fifth less Glim.
	GlimPct: 80
	Install:
		Ore: 600
		Salvage: 600
		Days: 4
		Engineers: 14
plating:
	Name: Armoured plating
	Kind: room
	Description: Salvaged plate welded over the Forge's flanks. A quarter more hull.
	HullPct: 125
	Slots: 0
	Install:
		Ore: 1200
		Salvage: 800
		Days: 5
		Engineers: 18
second-hangar:
	Name: Second hangar
	Kind: room
	Requires: hangar
	Description: A whole new hangar deck where the ore holds were. Room for ten more capacity of ships.
	Capacity: 10
	Install:
		Ore: 1600
		Salvage: 900
		Days: 6
		Engineers: 20
repair-bays:
	Name: Repair bays
	Kind: room
	Description: Cradles and welders in the hangar. Ships aboard mend much faster between places.
	Heal: 15
	Install:
		Ore: 500
		Salvage: 400
		Days: 3
		Engineers: 12
foundry-line:
	Name: Foundry line
	Kind: room
	Description: A second casting line in the foundry. Ships are built a third faster.
	BuildPct: 130
	Install:
		Ore: 800
		Salvage: 500
		Days: 4
		Engineers: 16
fire-control:
	Name: Fire control
	Kind: room
	Description: A proper fire-control room for the Forge's own turrets. They hit four tenths harder.
	ForgeDamagePct: 140
	Install:
		Ore: 700
		Salvage: 600
		Days: 3
		Engineers: 12
launch-rails:
	Name: Launch rails
	Kind: room
	Description: Magnetic rails in the bays. The fleet launches twice as fast on arrival.
	LaunchPct: 50
	Slots: 0
	Install:
		Ore: 400
		Salvage: 300
		Days: 2
		Engineers: 8
heavy-plating:
	Name: Heavy plating
	Kind: room
	Requires: plating
	Description: A second skin over the first. A quarter more hull again.
	HullPct: 125
	Slots: 0
	Install:
		Ore: 1800
		Salvage: 1200
		Days: 6
		Engineers: 22
# The rooms that came with the new deck plan
quarters:
	Name: Crew quarters
	Kind: room
	Description: Bunks where the cargo nets were. Forty more people can live aboard without sleeping in the corridors.
	Berths: 40
	Install:
		Ore: 500
		Salvage: 300
		Days: 2
		Engineers: 10
messhall:
	Name: Mess hall
	Kind: room
	Description: Long tables, a stove, and somewhere to sit together. The crew settle happier, and hunger and thirst ease off faster.
	MoraleUp: 5
	Recover: 1
	Strain: hunger, thirst
	Install:
		Ore: 400
		Salvage: 300
		Days: 2
		Engineers: 8
infirmary:
	Name: Infirmary
	Kind: room
	Description: Cots, lamps and a surgeon's tools. Every kind of strain eases off a level faster, and the infirmary station can open.
	Recover: 1
	CarePct: 80
	Install:
		Ore: 600
		Salvage: 500
		Days: 3
		Engineers: 12
chartroom:
	Name: Chart room
	Kind: room
	Description: A table of brass and glass, and old charts nobody aboard can read yet. New clue circles are a third smaller.
	CluePct: 67
	Install:
		Ore: 400
		Salvage: 400
		Days: 2
		Engineers: 8
workshop:
	Name: Workshop
	Kind: room
	Description: Lathes, a forge and racks of spares. Repairs take a quarter less ore and salvage.
	RepairCostPct: 75
	Install:
		Ore: 500
		Salvage: 200
		Days: 2
		Engineers: 10
stillroom:
	Name: Still room
	Kind: room
	Description: Coils and condensers that win back every drop the crew sweat and breathe. They drink a fifth less water.
	WaterPct: 80
	Install:
		Ore: 300
		Salvage: 400
		Days: 2
		Engineers: 8
