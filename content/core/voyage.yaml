# The voyage: the numbers behind the galaxy map. Every one of them can be changed by a pack.
#
# Stores the crew lives on: ice (melted into water), food and air. Needs are per 10 crew per
# day. A day passes for each day of travel or work on the galaxy map, and every DayTicks of
# play on a map (6000 ticks = 4 minutes).

Voyage:
	DayTicks: 6000
	# what a new voyage starts with
	Crew: engineers 30, pilots 24, miners 30, hands 66
	# (Milestone 24: every life wakes with full tanks; it was ice 2400, glim 700, spores 120, food 1600, air 900)
	Stores: ore 1500, ice 7000, salvage 150, glim 2200, spores 300, food 2400, air 1000, cogmarks 60
	# a short voyage starts better supplied, and fitting drive parts costs this percent
	ShortStores: ore 2500, ice 7000, salvage 600, glim 2200, spores 500, food 3000, air 1000, cogmarks 120
	ShortInstallPct: 60
	Morale: 70
	# per 10 crew per day
	# (Milestone 24 halved Water, from 6: water runs were two map visits in three)
	Need:
		Water: 3
		Food: 8
		Air: 10
	# life support makes air from water; the tank holds this much
	AirTank: 1000
	AirPerDay: 170
	WaterPerAir: 25
	# hydroponics grows food from water, and much faster with spores
	FoodPerDay: 100
	WaterPerFood: 30
	SporeFood: 70
	SporesPerDay: 20
	# percent: a store is "low" under this many days of need
	LowDays: 3
	# (before Milestone 17, hunger and bad air killed: StarvePct, SuffocatePct and AirlessDays
	# are no longer used. Shortages strain the crew instead: see Strain below)
	StarvePct: 2
	SuffocatePct: 8
	AirlessDays: 3
	# the Skein Drive: base stitch in spans; Glim per 10 spans; days per stitch = 1 + length / DaySpan
	BaseRange: 100
	GlimPer10: 6
	DaySpan: 90
	# a short voyage: every stitch a day
	ShortDaySpan: 1000
	# charted space (Milestone 24): a lane the Forge has stitched along before, in this life or
	# an earlier one, takes ChartedDays days and ChartedGlim percent of the Glim
	ChartedDays: 1
	ChartedGlim: 50
	# drifting without Glim, at sub-light: days per 10 spans
	DriftDaysPer10: 1
	# levels (Milestone 19): a ship gains a level for each map it launched on, survived and came
	# home from (LevelPoints each, sped by the wing commander's work and drills), up to Levels;
	# each level above the first adds RankBonus percent damage and hull. At PerkLevels its pilot
	# picks a perk (crew.yaml Perks). (Ranks: the old experience thresholds, for old saves.)
	Levels: 5
	LevelPoints: 100
	RankBonus: 5
	PerkLevels: 3, 5
	Ranks: Seasoned 4, Veteran 10, Elite 20
	# the hangar (the muster): berths by count (hangar rooms add Bays); a ship scrapped gives back
	# ScrapPct percent of its ore, and its crew move into the Forge
	HangarBerths: 10
	ScrapPct: 50
	# wayhouses (Milestone 20): this many in each region; drifters who ask to come aboard (once a
	# life at each), and the percent chance one of them has a name (a pilot, or an officer)
	Wayhouses: 2
	Drifters: 4-10
	NamedPct: 35
	# ships aboard the Forge mend this percent of their hull a day (repair bays add more)
	FleetHeal: 5
	# a day's deep scan from the chart: Glim it costs (it sees twice the sensor range)
	ScanGlim: 40
	# the boilers' daily draw of Glim. With none, the boilers go cold: every system works at
	# ColdPct of its output, and cold strain builds
	ReactorGlim: 10
	ColdPct: 50
	# sensors: how far the chart reveals what a place is (spans, at full condition)
	SensorRange: 170
	# repairs, per day of work: points of condition per engineer (in tenths), and cost per point
	RepairPer10Engineers: 5
	RepairOre: 6
	RepairSalvage: 4
	# hull repairs: percent of the hull per day per 10 engineers, and cost per percent
	HullPer10Engineers: 2
	HullOre: 30
	HullSalvage: 12
	# morale: drifts toward a target each day (up to Rise, down to Fall)
	MoraleTarget: 70
	MoraleRise: 3
	MoraleFall: 6
	MoraleLow: 10
	MoraleOut: 25
	MoraleRest: 10
	MoraleLoss: 2
	MoraleWin: 4
	# (MoraleSlow, SlowPct, MoraleDesert and DesertPct are no longer used: moods and strikes
	# below take their place)
	MoraleSlow: 30
	SlowPct: 75
	MoraleDesert: 15
	DesertPct: 2
	# Forge systems: hull damage on a map wears systems down (points per percent of hull lost)
	SystemWear: 2
	# a place yields less each time it is visited again (percent per visit; never below Floor)
	RevisitPct: 35
	RevisitFloor: 30
	# hazard pockets (hazards.yaml): their places yield more (percent), and each one's cache
	# holds this many echoes, once in a campaign
	PocketRichness: 150
	CacheEchoes: 2
	# the deck plan: room slots; people who can live aboard before the quarters are crowded
	DeckSlots: 8
	Berths: 160
	# cogmarks: Shearers find one in the wrecks for every this much salvage cut
	SalvagePerCogmark: 20
	# the Meridian date (Milestone 22): the Anchorage's last record (year month day); the moment
	# every life wakes (year month day hour minute second), known once the Horologe is remembered
	LastRecord: 4324 3 2
	WokeOn: 4471 6 17 6 42 19
	MonthDays: 30
	YearMonths: 12
	# story places (memories.yaml Anchors) never take over these kinds of place, if they can help it
	AnchorSpare: IceTail, LanternMist, HollowhornGrounds, StillWater

# Training a station (the bridge, Milestone 18): to level 2, then 3, for this life. Cogmarks and
# Days for each level; Remembered: the percent it costs where Jacob remembers any of the
# station's memories (crew.yaml Stations, Memories).
Training:
	Cogmarks: 30, 60
	Days: 1, 2
	Remembered: 50

# Strain (PLAN.md §6): running out of water, food, air or boiler heat weakens the Forge; it never
# kills. Each kind rises a level (to 3) for each day it is out, and falls a level a day once it
# is back (the mess hall and infirmary take off more: items.yaml Recover). Every level, of any
# kind, costs: Work percent slower, Cost percent dearer to build, Glim percent more a stitch,
# Ships percent weaker on maps; each capped at Cap levels. At levels 2 and 3, the stations
# named go dark, one each (crew.yaml Stations).
Strain:
	Work: 15
	Cost: 10
	Glim: 10
	Ships: 5
	Cap: 4
	Dark:
		thirst: lifesupport, infirmary
		hunger: hangar, stores
		air: infirmary, comms
		cold: engineering, foundry

# The crew's mood: a mark everyone can see over the morale number. Content: morale Content or
# more and nothing short, work WorkPct faster. Uneasy: morale under Content or a store low,
# building, ships and Glim a stitch Cost percent dearer. Angry: morale under Angry or a store
# out, Cost percent dearer. Under Strike, a station's crew walk off each day (one at a time),
# and come back once morale is over Back, or after a parley (a day, or Pay cogmarks a station).
# Grief: days the crew grieve after deaths. Crowded: morale they lose over the berths.
Mood:
	Content: 60
	Angry: 30
	WorkPct: 110
	UneasyCost: 110
	AngryCost: 130
	Strike: 15
	Back: 30
	Pay: 40
	ParleyMorale: 5
	Grief: 3
	Crowded: 10

# All hands: every station green (morale Content or more, nothing short, no strain, every
# station that is built online and staffed, no strike). While it lasts: work Work percent
# faster on top of Content, ships Ships percent better, Glim a stitch Glim percent, and morale
# doesn't fall overnight. Song: days of it in a row that earn a crew moment (events).
AllHands:
	Work: 110
	Ships: 105
	Glim: 90
	Song: 6

# The Forge's systems, in the order the Forge screen lists them.
Systems:
	drive:
		Name: Skein Drive
		Description: Stitches. Damaged, it reaches less far and spools slower; at zero it cannot stitch at all.
	reactor:
		Name: Reactor
		Description: Powers everything. Damaged, every other system works slower.
	life:
		Name: Life support
		Description: Makes air from water.
	hydro:
		Name: Hydroponics
		Description: Grows food from water and spores.
	foundry:
		Name: Foundry
		Description: Builds ships. Damaged, building is slower; at zero it stops.
	sensors:
		Name: Sensors
		Description: How far the chart can see what a place is.

# The Wound on the chart (Milestone 21; PLAN.md §3, "How the Hands escalate"). There is no
# countdown: the Mainspring's attention rises, and the Hands grow with it (galaxy/wound.js).
# Its level is the highest one whose At the points have reached. Hands: how many hunt the
# Forge at that level; Strong: they are faster and grow Stingers and Gnawers.
Wound:
	Quiet:
		At: 0
		Text: Nothing hunts the Forge yet. Only signs: a dead Hour drifting, the havens' stories.
	Noticed:
		At: 20
		Text: Something has heard the Twain. Now and then a few Ticks and a Hound turn up.
	Hunted:
		At: 45
		Hands: 1
		Text: A Hand has set out from the Shore. It follows wherever the Forge was last heard.
	Marked:
		At: 80
		Hands: 2
		Strong: true
		Text: Two Hands hunt the Forge, faster and stronger, and they plant Nurseries as they go.
	Max: 100
	# what raises it: a memory recovered (the louder the Twain sings); a point every DaysPer
	# days; a point a day after StayFrom days at one place; each Nursery burned and Hour killed
	Memory: 5
	DaysPer: 5
	StayFrom: 6
	Burned: 2
	HourKilled: 4
	# what lowers it: a point a day with silent running; Choir points a day at a place of the
	# Choir; Static points for a stitch through a static field, where the Hands won't follow.
	# Destroying a Hand drops it to the level below.
	Silent: 1
	Choir: 2
	Static: 4
	# a new life wakes near the level its memories have earned: StartPer a memory, to StartMax
	StartPer: 3
	StartMax: 60
	# the Hands: they set out from HandFrom and move a lane every MoveDays (fewer when Strong),
	# losing the trail LosePct of the time; Power to start, Grow more a day (StrongPct when
	# Strong). The chart shows a Hand, and ticks, when it is SeeHops lanes away or nearer.
	HandFrom: Shore
	MoveDays: 2-3
	StrongDays: 2
	LosePct: 20
	Power: 100
	Grow: 4
	StrongPct: 150
	SeeHops: 2
	# a long life is a loud one (Milestone 24): from each LifeDays day of a life, the point that
	# days passing bring (every DaysPer days) is multiplied: 4 from the start, 8 from day 20, 12
	# from day 40, so a Hand sets out around day 25 to 30 even in a first life
	LifeDays: 0 4, 20 8, 40 12
	# the Hands grow with the life: a Hand's pack has HandAgePct percent more Hounds and Ticks,
	# and every ship in it as much more hull, for every HandAgeDays days of the life
	HandAgeDays: 30
	HandAgePct: 15
	# from day SecondHand of a life a second Hand, a strong one, sets out whatever the attention;
	# from day KeepTrail the Hands follow the Forge itself (running silent or not), never lose
	# the trail, come a lane every TrailDays, and rest only TrailRest days after being shaken off
	# or torn free of
	SecondHand: 60
	KeepTrail: 42
	TrailDays: 1
	TrailRest: 2
	# a small galaxy's life ages faster: its days count this percent for all of the above
	ShortLifePct: 200
	# and in a small galaxy the first Hand sets out on this day of every life, whatever the attention
	ShortFirstHand: 1
	# every Hour killed buys a reprieve: the life counts this many days younger for all of the above
	KillReprieve: 45
	# caught: each day the Hand's pickets cost the Forge Harass percent hull; stitching away
	# without a fight costs Escape (hull percent, morale, system wear)
	Harass: 3
	Escape: hull 12, morale 8, wear 10
	# shaken off on a map, or torn free of: it loses the trail for Rest days, and can't catch
	Rest: 5
	# a Hand may infest each place it leaves (Hunted and on): InfestPct, up to InfestMax places
	InfestPct: 30
	InfestMax: 6
	# Noticed and on: a lone pack roams these regions, turning up on RoamPct of their maps
	Roam: Hush 20, Shore 30
	RoamPack: hound, tick, tick, tick, tick
	# on a map: a Hand's Hour comes on after HuntDelay seconds with a pack for its power (a
	# Hound for every PackHound, a Tick for every PackTick, two Feeders), and IchorPer ichor a
	# point of power to grow more. An infested place: Nurseries (a range), a garrison, sensors
	# at Haze percent in the spore haze
	HuntDelay: 45
	PackHound: 120
	PackTick: 35
	IchorPer: 3
	Nurseries: 2-3
	Garrison: hound, tick, tick, tick, feeder, feeder
	GarrisonIchor: 200
	Haze: 70
	# burning an infested place out (every Nursery, or the Hour): echoes, and CaptivePct of the
	# time captives they took from the havens, rescued (Captives: a range of hands)
	CleanseEchoes: 1
	CaptivePct: 40
	Captives: 3-8
	# the Mainspring's lair (Milestone 22): its pack, its Nurseries, and ichor to grow more
	LairPack: hound, hound, stinger, stinger, chime, tick, tick, tick, tick, tick, tick, feeder, feeder
	LairNurseries: 1
	# (its pods are slower than an Hour's: percent of each ship's growing time)
	LairGrowPct: 160
	LairIchor: 400
	# on a short voyage the Mainspring and its pack are this much of themselves (percent)
	ShortLairPct: 100
