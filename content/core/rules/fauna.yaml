	Tooltip:
		Name: The Hollowhorn
		Class: Leviathan
		Role: Monster
		Description: Something the size of a Forge that has lived in the Wrack longer than anything else. Its horn is hollow, and it sings through it.
	Health:
		HP: 1500000
		Radius: 3000
		HalfLength: 6000
	Armor:
		Type: capital
	Selectable:
		Radius: 8000
	Flight:
		MaxSpeed: 22
		Acceleration: 1
		Deceleration: 1
		TurnSpeed: 2
		PitchSpeed: 2
		MinSpeed: 0
		Slip: 80
		Bank: 8
