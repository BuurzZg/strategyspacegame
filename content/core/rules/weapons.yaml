# Weapons. Ranges, HitRadius and Spread are world units (1024 per cell, about 100 m);
# Speed is per tick (25 ticks a second); ReloadDelay in ticks. Tracking: how much of a moving
# target's motion the gunner leads, in % (heavy batteries can't follow a jinking fighter).
# Versus: % damage by armour type: light (fighters, Gleaners), medium (corvettes),
# heavy (frigates, Smelter), capital (destroyers, the Forge).
#
# The counters: flak shreds fighters; pulse batteries tear up corvettes; plasma charges
# and torpedoes crack frigates and capitals; autocannons hunt bombers; lances kill capitals.

Autocannon:
	ReloadDelay: 3
	Range: 2600
	Report: cannon
	Projectile: Bolt
		Speed: 700
		HitRadius: 140
		Inaccuracy: 40
		Color: ffe6a8
		Size: 60
	Warhead@hit: SpreadDamage
		Damage: 160
		Versus:
			light: 100
			medium: 45
			heavy: 40
			capital: 20

