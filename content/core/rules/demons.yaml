# The Wound (PLAN.md §3): the tech demons, the Mainspring's Hands. Grown, not built: every hull
# mirrors one of ours, gestated in pods along an Hour's flanks from ichor, the living matter and
# stolen time their Feeders strip from wrecks and the dead (traits/demons.js). They play as an
# RTS opponent (the WoundAI world trait). Always hostile: no reputation, no comms.
#   Gestation   Ichor: what one costs; Time: ticks in the pod
#   Feeds       strips wrecks: Rate salvage a second, IchorPct of it ichor; Heal: hull mended a salvage
#   Gestates    an Hour's pods: Pods (at once), Types it can grow
#   Buds        a Nursery: a Tick or Feeder every Interval ticks (up to Cap near it), Trickle
#               ichor a second, and the creep: demons within Creep mend Heal a second
#   Drags       time drags near it: enemy ships within Range fly at Pct of their speed
#   Flees       under FleePct hull it runs to regrow (Regen a second) until ReturnPct

