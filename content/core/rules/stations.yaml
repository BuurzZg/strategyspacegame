# Faction stations, built into wrecks and rock, and the Choir's swarms. Stations never move;
# their guns fire from where they are. Destroying one costs a great deal of standing.

^Station:
	Tooltip:
	Valued:
		Cost: 3000
	Health:
	Armor:
		Type: capital
	Selectable:
	WithModel:
	Attacks:
		Style: turret
	Stance:
		Initial: defensive
	AutoTarget:
		ScanRange: 4200
	LeavesWreck:
		Pct: 25
	Station:
	Sensors:
		Range: 14000

hulltown:
	Inherits: ^Station
	Tooltip:
		Name: Hull-town
		Class: Station
		Role: Rivet Moot settlement
		Description: A gutted capital ship with a town inside it. Lights in every porthole, and someone always hammering.
	Health:
		HP: 900000
		Radius: 2200
		HalfLength: 3400
	Selectable:
		Radius: 3600
	WithModel:
		Model: hulltown
	Armament@a:
		Weapon: PointDefence
		Forward: 3000
		Up: 900
	Armament@b:
		Weapon: PointDefence
		Forward: -3000
		Up: 900
	Armament@c:
		Weapon: PulseBattery
		Up: 1400

