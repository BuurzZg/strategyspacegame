# Named crew. Most of the people aboard the Forge are a head count in four roles (engineers,
# pilots, miners, hands). A few have names: the officers who head its departments, and the
# lead of every armed ship (its pilot, or the captain of a ship crewed by hands). They are
# counted in their role like everyone else, so the head counts and the names always agree.
#
# Posts: the officers.
#   Role   which role they come from
#   Bonus  what their work changes (the same percent keys engineering projects use):
#          RepairPct (a day's repairs), BuildPct (the foundry), FoodPct (the hydroponics),
#          GlimPct (Glim a stitch), SensorPct (sensor range), TradePct (prices you pay),
#          CarePct (what strain costs the Forge), XpPct (experience ships earn), CluePct (how
#          big new clue circles are drawn)
#          An officer's work counts half while their station is at level 1, and in full once it
#          is trained to level 2 (Stations, below).
#   Less   true when their work lowers the number (GlimPct, TradePct, CarePct, CluePct)
#
# Traits: what someone is like. An officer's Work adds to their post's bonus, in percent;
# a lead's Damage, Hull and Learn (experience) change their ship, in percent. Morale adds to
# the crew's morale while they are aboard. Modifiers hold only while When holds (the same
# conditions as events: morale >= 60, day >= 200, officer surgeon, ...).
#   For      officer, lead or both (who can be given it when they join)
#   Weight   how often it is given (0: only by events and growth)
#   After, Becomes   after this many days in the trait, it becomes another
#   Escape   once, they get out of their ship when it is lost, and take this trait
#
# Leads: the title of an armed ship's lead, by its crew's role. Ships crewed by other roles
# have no named lead.

Posts:
	engineer:
		Name: Chief engineer
		Role: engineers
		Bonus: RepairPct
		Text: Runs the repair crews. Their work changes how much a day of repairs mends.
	foundry:
		Name: Foundry master
		Role: engineers
		Bonus: BuildPct
		Text: Runs the foundry. Their work changes how fast ships are built.
	grower:
		Name: Grower
		Role: hands
		Bonus: FoodPct
		Text: Keeps the hydroponics. Their work changes how much food grows.
	navigator:
		Name: Navigator
		Role: pilots
		Bonus: GlimPct
		Less: true
		Text: Plots the stitches. Their work changes the Glim each stitch burns.
	watch:
		Name: Watch officer
		Role: hands
		Bonus: SensorPct
		Text: Keeps the sensor watch. Their work changes how far the sensors reach.
	quartermaster:
		Name: Quartermaster
		Role: hands
		Bonus: TradePct
		Less: true
		Text: Does the haggling. Their work changes what traders ask.
	surgeon:
		Name: Surgeon
		Role: hands
		Bonus: CarePct
		Less: true
		Text: Keeps people going. Their work changes how hard strain hits the Forge.
	wing:
		Name: Wing commander
		Role: pilots
		Bonus: XpPct
		Text: Drills the pilots and captains. Their work changes how fast ships earn experience.
	signals:
		Name: Signals officer
		Role: hands
		Bonus: CluePct
		Less: true
		Text: Works the comms set and the listening watch. Their work changes how tight new clue circles are drawn.

# Stations: the Forge's departments, each run by an officer's post (PLAN.md §6). A station is
# online, dim (no officer, or its system under half), dark (strain, or what it needs is not
# there yet), striking (its crew have walked off) or cold (the boilers are out: half its work).
# Its level (the bridge, Milestone 18): 0 while it is dark or not yet open; every open station
# wakes at 1 each life; training (voyage.yaml Training) takes it to 2 and 3 for this life,
# each level bringing one of its trained skills (Skills, below).
#   Post       the officer who runs it (none: the hands keep it)
#   System     the Forge system it works through (voyage.yaml Systems)
#   Needs      a memory it needs before it can open; Room: a room it needs on the deck plan
#   Text       what it runs; Dark: what is lost while it is dark or striking
#   Memories   what Jacob remembers for it, for good (memories.yaml): shown on the bridge;
#              any one of them known makes its training cheaper
#   Train      its trained skills, at level 2 and level 3
Stations:
	engineering:
		Name: Engineering
		Post: engineer
		Text: Repairs, the hull, the Forge's systems, and building rooms.
		Dark: No repairs and no building on the deck plan.
		Memories: shields, baffles, rods, lead
		Train: field-repairs, damage-control
	navigation:
		Name: Navigation
		Post: navigator
		System: drive
		Text: Stitches and routes.
		Dark: Every stitch burns half again as much Glim.
		Memories: coils, lens, spindle, heartstone
		Train: plotted-courses, quick-stitch
	sensors:
		Name: Sensors
		Post: watch
		System: sensors
		Needs: radar
		Text: The chart's reach, deep scans and clue circles.
		Dark: The chart goes dark past the next lane; no deep scans.
		Memories: radar, chartroom
		Train: long-watch, cheap-scans
	foundry:
		Name: Foundry
		Post: foundry
		System: foundry
		Text: Building ships on maps.
		Dark: No ships can be built.
		Memories: hull-wisp, hull-talon, hull-sabre, hull-spindle, hull-monolith
		Train: shift-work, salvage-line
	lifesupport:
		Name: Life support
		Post: grower
		System: life
		Text: Air, water and the hydroponics.
		Dark: No air is made.
		Train: ration-plan, recyclers
	hangar:
		Name: Hangar
		Post: wing
		Text: Launches, and the fleet between maps.
		Dark: Launches take twice as long.
		Memories: silent
		Train: drills, fast-launch
	comms:
		Name: Comms
		Post: signals
		Text: Hailing, trade, signals and clues.
		Dark: Nobody can be hailed.
		Memories: help, afraid, lists, otherhalf
		Train: long-hails, signal-decoding
	infirmary:
		Name: Infirmary
		Post: surgeon
		Needs: infirmary
		Room: infirmary
		Text: Strain recovery and care.
		Dark: Strain eases no faster than a level a day.
		Memories: infirmary
		Train: triage, field-hospital
	stores:
		Name: Stores
		Post: quartermaster
		Text: The hold, trade and cogmarks.
		Dark: Traders charge a quarter more.
		Train: ledgers, tight-holds

# Perks: at levels 3 and 5 (voyage.yaml PerkLevels) a ship's pilot picks one, from three on offer.
# Each changes how the ship fights on a map, rather than a number (combat.js AutoTarget).
Perks:
	guardian:
		Name: Covers the Forge
		Text: Only goes after enemies near the Forge, and never strays far from it.
	steady:
		Name: Holds formation
		Text: Launches holding back: returns fire from where it is, and never breaks formation to chase.
	hunter:
		Name: Hunter
		Text: Looks further and chases longer than anyone else.
	finisher:
		Name: Finisher
		Text: Goes for whatever enemy is closest to breaking, not whatever is closest.
	survivor:
		Name: Gets them home
		Text: When the hull is badly hurt, turns for the Forge and goes aboard.

# Skills: what a trained station can do (Stations, Train). Each is relearned every life.
# Percent keys multiply like a room's (items.yaml): RepairCostPct, GlimPct, SensorPct, BuildPct,
# WaterPct, XpPct, LaunchPct, CarePct, TradePct; and SystemWearPct (systems worn by hull damage),
# ScanPct (a deep scan's Glim), SalvageCogPct (cogmarks found in wrecks), NeedPct (food and air
# the crew need), CargoPct (what a map brings home). Counts add: QuickStitch (days off a stitch
# of three days or more), HailReach (lanes away you can hail), Decode (percent chance, on each
# arrival, of a clue tightening a circle), Triage (percent of leads lost with their ships who
# are pulled out alive).
Skills:
	field-repairs:
		Name: Field repairs
		Text: Patches that hold. Repairs take a fifth less ore and salvage.
		RepairCostPct: 80
	damage-control:
		Name: Damage control
		Text: Crews at every bulkhead. Hull damage wears the systems half as much.
		SystemWearPct: 50
	plotted-courses:
		Name: Plotted courses
		Text: Every stitch planned to the span. A tenth less Glim.
		GlimPct: 90
	quick-stitch:
		Name: Quick stitch
		Text: Long stitches cut short. A stitch of three days or more takes a day less.
		QuickStitch: 1
	long-watch:
		Name: Long watch
		Text: Someone at the scopes every hour. The sensors reach a quarter further.
		SensorPct: 125
	cheap-scans:
		Name: Cheap scans
		Text: Deep scans on half the Glim.
		ScanPct: 50
	shift-work:
		Name: Shift work
		Text: The foundry never stops. Ships are built a fifth faster.
		BuildPct: 120
	salvage-line:
		Name: Salvage line
		Text: Every wreck sorted to the last cog. Twice the cogmarks from salvage.
		SalvageCogPct: 200
	ration-plan:
		Name: Ration plan
		Text: Measured portions, and slow breathing on the night watch. A tenth less food and air.
		NeedPct: 90
	recyclers:
		Name: Recyclers
		Text: Water goes round twice. The crew drink a sixth less.
		WaterPct: 85
	drills:
		Name: Drills
		Text: Live drills off the bow. Ships earn experience a quarter faster.
		XpPct: 125
	fast-launch:
		Name: Fast launch
		Text: Crews in their cockpits before the Forge arrives. Launches a quarter faster.
		LaunchPct: 75
	long-hails:
		Name: Long-range hails
		Text: The big set, tuned. Hail whoever holds a place one lane away.
		HailReach: 1
	signal-decoding:
		Name: Signal decoding
		Text: Scraps of old signals, pieced together. On each arrival, a chance that a clue circle tightens.
		Decode: 25
	triage:
		Name: Triage
		Text: A rescue crew on every launch. A third of the leads lost with their ships are pulled out alive.
		Triage: 33
	field-hospital:
		Name: Field hospital
		Text: Cots in the corridors when it counts. Strain costs a fifth less.
		CarePct: 80
	ledgers:
		Name: Ledgers
		Text: The quartermaster knows every price in the Wrack. Traders ask a tenth less.
		TradePct: 90
	tight-holds:
		Name: Tight holds
		Text: The hold packed to the rivets. A tenth more of what each map brings home.
		CargoPct: 110

Leads:
	pilots: Pilot
	hands: Captain

Traits:
	steady:
		Name: Steady
		Text: Does the job, every day, without fuss.
		For: both
		Weight: 30
		Work: 10
		Hull: 10
	gifted:
		Name: Gifted
		Text: The best at this the Forge has had.
		For: officer
		Weight: 8
		Work: 25
	green:
		Name: Green
		Text: New to it, and still learning. In 50 days they will have the hang of it.
		For: both
		Weight: 10
		Work: -10
		Damage: -10
		After: 50
		Becomes: steady
	grim:
		Name: Grim
		Text: Gets results and does not care who it upsets.
		For: both
		Weight: 8
		Work: 15
		Damage: 10
		Morale: -2
	beloved:
		Name: Beloved
		Text: People would follow them anywhere.
		For: both
		Weight: 8
		Morale: 3
	drinker:
		Name: Drinker
		Text: Keeps a still behind the hydroponics racks, and shares.
		For: officer
		Weight: 6
		Work: -10
		Morale: 2
	fairweather:
		Name: Fair-weather
		Text: Brilliant while things go well.
		For: both
		Weight: 6
		Work: 20
		Damage: 15
		When: morale >= 60
	iron:
		Name: Iron
		Text: At their best when everything is falling apart.
		For: both
		Weight: 6
		Work: 25
		Damage: 20
		When: morale <= 40
	homesick:
		Name: Homesick
		Text: Counts the days. After the 250th, it starts to show.
		For: both
		Weight: 5
		Work: -15
		Damage: -10
		Morale: -1
		When: day >= 250
	ace:
		Name: Ace
		Text: Born for a cockpit.
		For: lead
		Weight: 10
		Damage: 20
	careful:
		Name: Careful
		Text: Flies as if the hull were their own skin.
		For: lead
		Weight: 10
		Hull: 20
	hotshot:
		Name: Hotshot
		Text: Fast, loud and closer to the enemy than anyone needs to be.
		For: lead
		Weight: 8
		Damage: 30
		Hull: -15
	quick:
		Name: Quick study
		Text: Learns something from every fight.
		For: lead
		Weight: 8
		Learn: 60
	lucky:
		Name: Lucky
		Text: Has walked away from wrecks before. Once more, maybe.
		For: lead
		Weight: 6
		Escape: shaken
	shaken:
		Name: Shaken
		Text: Got out of a dying ship and has not been the same since. It may pass in 40 days.
		For: both
		Weight: 0
		Work: -10
		Damage: -15
		After: 40
		Becomes: steady
