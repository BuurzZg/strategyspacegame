# The base game, as a content pack. An add-on is another folder like this one; packs load
# in order and later ones extend or override earlier ones (MiniYAML merging: same keys
# merge, -Key removes).
#
#   Rules       actor definitions (ships, fauna, world, player)
#   Weapons     weapon definitions
#   Resources   stores and map resources
#   PoiTypes    point-of-interest templates
#   Regions     the galaxy's regions, inner to outer
#   Items       drive components (later: relics, blueprints)
#   Voyage      the numbers behind the galaxy map, and the Forge's systems
#   Names       name generators
#   Races       races, and where their factions start
#   Factions    factions, their territory and fleets, and the reputation numbers
#   Trade       values, prices and treaties
#   Dialogs     comms trees, one per faction
#   Events      story and galaxy events
#   Hints       hint cards for a guided first voyage
#   Crew        named crew: officers' posts, traits, ship leads

Pack:
	Id: core
	Name: Driftforge
	Version: 1
	Rules: rules/world.yaml, rules/player.yaml, rules/defaults.yaml, rules/ships.yaml, rules/warships.yaml, rules/fauna.yaml, rules/combat.yaml, rules/deposits.yaml, rules/stations.yaml
	Weapons: rules/weapons.yaml
	Resources: resources.yaml
	PoiTypes: poi-types.yaml
	Regions: regions.yaml
	Items: items.yaml
	Voyage: voyage.yaml
	Names: names.yaml
	Races: races.yaml
	Factions: factions.yaml
	Trade: trade.yaml
	Dialogs: dialogs/rivet.yaml, dialogs/synod.yaml, dialogs/gaunt.yaml, dialogs/cinder.yaml, dialogs/choir.yaml
	Events: events/story.yaml, events/galaxy.yaml, events/crew.yaml
	Hints: hints.yaml
	Crew: crew.yaml
