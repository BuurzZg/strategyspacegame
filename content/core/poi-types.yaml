Wreck:
	Name: Wreck
	Description: One giant derelict, and the debris of whatever killed it. Rich salvage, and someone may have got here first.
	Size: 160, 160, 56
	Sky: 6a3a3a
	Hulk:
		Of: forge
		Salvage: 2400-3600
		Size: 2600
	Wrecks:
		Count: 6-9
		Of: halberd, picket, sabre, spindle
		Salvage: 150-400
		Clusters: 1-2
	Deposit@ore:
		Kind: ore
		Fields: 1-2
		Rocks: 5-8
		Spread: 4-6
		Amount: 400-900
	Nebula:
		Count: 1
		Size: 30-40
		Color: 7a3a3a
	Encounter@scavengers:
		Side: gaunt
		Ships: dart, dart, dart, picket, halberd
		Count: 1
		Chance: 70
		Behaviour: lurk
	Names: Patient Hour, Ninth Lantern, Ashgrove, Quiet Tithe, Long Answer, Salt Meridian, Glass Orchard, Ember Psalm
