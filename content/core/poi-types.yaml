		Kind: glim
		Count: 4-6
		Size: 2800-4000
		Amount: 500-1100
	Clouds@spores:
		Kind: spores
		Count: 3-5
		Size: 2400-3400
		Amount: 400-900
	Deposit@ore:
		Kind: ore
		Fields: 1
		Rocks: 5-7
		Spread: 4-5
		Amount: 400-800
	Nebula:
		Count: 3-4
