	Size: 176, 176, 64
	Sky: 3a5a8a
	Deposit@ore:
		Kind: ore
		Fields: 3-4
		Rocks: 8-12
		Spread: 5-8
		Amount: 900-2000
	Formation@arch:
		Shape: arch
		Count: 1-2
		Size: 8-12
	Formation@ring:
		Shape: ring
		Count: 0-1
		Size: 9-13
	Formation@spire:
		Shape: spire
		Count: 1-2
		Size: 6-9
	Nebula:
		Count: 1
		Size: 40-60
		Color: 2a5a7a

