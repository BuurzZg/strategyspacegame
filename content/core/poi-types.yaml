# Point-of-interest templates. Each visit builds a map from one of these, with the seed of
# that place, so the same place always comes out the same.
#
# Ranges are "min-max" (whole numbers); a single number means exactly that.
#   Size                    the map in cells (1 cell is about 100 m): width, depth, height
#   Sky                     backdrop tint (hex)
#   Deposit@name            asteroid fields: Kind (ore, ice), Fields, Rocks per field, Spread
#                           (cells), Amount per rock, Shape (ball, or tail: strung out in a line)
#   Wrecks                  derelicts: Count, Of (hulls they were), Salvage each, Clusters
#   Hulk                    one giant derelict: Of, Salvage, Size (radius in world units)
#   Clouds@name             gas: Kind (glim, spores), Count, Size (radius, world units), Amount
#   Formation@name          crystal rock: Shape (arch, ring, spire), Count, Size (cells)
#   Nebula                  coloured gas, for looks (and sensors, later): Count, Size (cells), Color
#   Encounter@name          hostiles: Side (gaunt, fauna), Ships, Count (groups), Chance (%),
#                           Behaviour (lurk: wait and pounce on what comes close; hunt: come for
#                           the Forge after Delay seconds), Delay
#                           (burrow: a Scrapwyrm, buried in a rock field until something comes close)
#   Mites (under Wrecks)    percent of the wrecks that are infested with rust mites
#   Names                   for named places (a Hulk's ship): picked from this list
#   Noun                    the second word of a place's name on the star chart (Marrow Reef)
#   Seal                    its wax seal on the star chart, once known: colour (hex) and letter
#                           (story places are black wax with a gilt letter)

ScrapShoal:
	Name: Scrap Shoal
	Seal: 8c7a62, X
