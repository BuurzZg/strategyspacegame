# The Tallow Bell, in the Middens: a Lantern Synod refinery-chapel, kept by Deacon Ilmar Sloe.
# Formal, and honest to the letter. (The format is at the top of rivet.yaml.)

bell:
	Start: hello
	Node@hello:
		Say: The Tallow Bell receives you, Forge. Glim refined under vow, food blessed and sealed, and the plan of a still room, entrusted to me for one ship only. State your need plainly.
		Say@Wary: The Bell receives everyone. It does not have to like them. State your need.
		Say@Hostile: The Bell is silent to you. Go in peace, or go.
		Choice@trade:
			Text: We would trade.
			If: tier >= Neutral, where chart
			Do: trade
		Choice@hire:
			Text: Are any of your engineers free to travel?
			If: tier >= Neutral, where chart
			Do: hire
		Choice@know:
			Text: You look at me as if you know me, Deacon.
			If: not remembers oath
			Goto: know
		Choice@vow:
			Text: What is the vow?
			If: tier >= Neutral
			Goto: vow
		Choice@bye:
			Text: Peace on the Bell.
			Do: close
	Node@vow:
		Say: That no Glim leaves this chapel short-weighted, and none goes to the hulls that bear the cog. We broke the second part, once, long ago, and the Synod has never forgiven itself. You will not ask me how long ago.
		Choice@bye:
			Text: We won't.
			Do: standing 1, close
	Node@know:
		Say: The Deacon is very old, even for a Tallowfolk: waxy, slow, his lantern turned down low. He looks at you for a long time. "I knew your face when mine was young. I have aged more than a hundred years since. You have not aged a day."
		Choice@how:
			Text: Tell me what you know.
			Goto: oath
	Node@oath:
		Say: "The Synod swore to guard the knot under Ninefold. We told the Knotfolk that your Company had come to unpick it. We broke your work where we could. Your Erik never explained himself to us, not once. Perhaps he could not. We were wrong about him, Captain. I am not yet sure we were wrong about you."
		Choice@ok:
			Text: Neither am I.
			Do: item oath found, standing 5, close
