# Factions: who claims the Wrack's places, and how they feel about you.
#   Race        races.yaml
#   Standing    where you start with them (-100 to 100); omit to start from the race standing
#   Regions     how much of each region they claim (weights)
#   Seats       stations in each region: places that become their Station type
#   Reach       how many lanes out from a seat they claim
#   Station     the place type of their seats (poi-types.yaml)
#   Patrol      the ships they keep at places they claim (more in dangerous regions)
#   Enemies     factions they fight on sight
#   Leave       from this tier on, you may mine and salvage in their territory
#   Sells       goods they trade away, with how much a station holds; Wants: goods they pay well for
#   Hires       crew for hire at their stations, by role; Ships: hulls they will sell, crewed
#   Info        what they know and will sell: survey (every place within two stitches), chart (a region)
#   Dialog      their comms tree (dialogs/<name>.yaml)

Reputation:
	# the lowest standing of each tier
	Tiers: Hostile -100, Wary -50, Neutral -10, Friendly 25, Allied 60
	# per ship of theirs you open fire on, per kill, per station destroyed
	Attack: -10
	Kill: -25
	StationKill: -60
	# per load taken from their territory without leave, when they see it; the first is a warning
	Steal: -1
	# fighting their enemies where they can see it: per kill, up to HelpMax a visit
	HelpKill: 2
	HelpMax: 15
	# cells: how far their ships and stations see theft; how near a wary faction lets you come
	SightRange: 22
	WarnRange: 16
	CloseRange: 9
	# seconds you may linger inside CloseRange of a wary faction after its warning
	WarnTime: 20
	# trading: per deal
	Trade: 1

rivet:
	Name: Rivet Moot
	Race: hullborn
	Standing: 30
	Description: Hullborn salvage clans who live in gutted capital ships. Friendly, nervous, and always buying.
	Regions: Drift 2, Middens 4, Hush 1
	Seats: Drift 1, Middens 3, Hush 1
	Reach: 1
	Station: HullTown
	Patrol: dart, dart, picket, halberd
	Enemies: gaunt
	Leave: Friendly
	# trade: what they sell (and how much they have), what they want, crew and ships for hire, information
	Sells: food 600, ice 800, salvage 400
	Wants: ore, glim
	Hires: hands 12, miners 6, engineers 4
	Ships: dart, picket, gleaner, shearer
	Info: survey
	Dialog: rivet

