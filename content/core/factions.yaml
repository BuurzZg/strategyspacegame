cinder:
	Name: Cinder Pact
	Race: humans
	Standing: -20
	Description: A league descended from another Forge that never got home. Hired ships, old charts, and an old rivalry.
	Regions: Middens 1, Hush 2, Shore 2
	Seats: Hush 1, Shore 1
	Reach: 2
	Station: CinderHold
	Patrol: dart, talon, halberd, spindle, sabre
