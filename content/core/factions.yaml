gaunt:
	Name: Ashen Gaunt
	Race: gaunt
	Standing: -60
	Description: Raiders and wreck-strippers. They respect strength, count debts, and hold the Anchor Spindle's secrets.
	Regions: Drift 1, Middens 2, Hush 2, Shore 4
	Seats: Middens 1, Hush 1, Shore 2
	Reach: 2
	Station: GauntDen
	Patrol: dart, dart, talon, talon, picket, halberd, sabre
	Enemies: rivet, synod, cinder
