hollowkin:
	Name: The Hollowkin
	Race: humans
	Standing: 10
	Description: The havens: the Company's survivors' descendants, on moons, rocks and wrecks across the Wrack. Some paint your emblem on their hulls without knowing what it means. Some wait for the old man with the great ship. Some curse him.
	Regions: Drift 0
	Reach: 0
	Dialog: waiting
