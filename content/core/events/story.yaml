# Story and galaxy events. An event is a small dialog (nodes, Say, choices) with a header:
#   When     start (a new life), arrive (at a place, after a stitch or a drift), travel (on the
#            way, once a stitch), day (a day of rest or repairs), found / install (a drive part:
#            set Item), home (the final jump)
#   Chance   percent (default 100); a trigger fires all its story events and at most one chance one
#   If       conditions, as in dialogs, plus: region X, type X, not type X, day >= n,
#            item X missing|found|installed (a drive part: found and installed both mean
#            remembered), here relic X, crew >= n, life >= n, life <= n, remembers X, not remembers X
#   Once     false: may happen again (story events happen once)
#   Title    the panel's heading
# Effects, as in dialogs, plus: give <store> n, crew <role> n, lose crew|<role> n,
#   damage hull|<system> n (percent), morale n, item <id> found, days n,
#   ambush <faction> <ship+ship+...> [delay s] (they are waiting on the next map here),
#   monster <type> [delay s], faction <id> n (standing), roll <percent> <node if yes> <node if no>,
#   clue <anchor> (a circle on the chart round it), echoes n (to recall memories with)

Prologue:
	When: start
	If: life <= 1
	Title: Waking
	Start: wake
	Node@wake:
		Say: White. Then a bridge, all brass and ticking, and alarms going off somewhere behind your eyes. Your hands are already on the helm. They know it. You don't.
		Choice@on:
			Text: Where are we?
			Goto: who
	Node@who:
		Say: Nobody knows. A dozen people at a dozen stations look up at you, and then down at the names stitched on their own uniforms. One engineer reads theirs out loud, slowly, like a word in a foreign language. The ship hums. The chart is dark.
		Choice@on:
			Text: Then we start with the chart.
			Goto: signal
	Node@signal:
		Say: One thing on it, very faint: a signal, a few stitches out, repeating. The watch officer turns it up. There is a picture in it, of a hammer inside a cog. The same mark is on the plate above the helm, and on your sleeve.
		Choice@on:
			Text: Find it.
			Do: clue anchorage, close

AnchorageHere:
	When: arrive
	If: here relic anchorage, not remembers emblem
	Title: The station
	Start: here
	Node@here:
		Say: A station, torn open and gone cold. The hammer and cog are painted on every plate that is still attached. The signal is coming from its core, sealed somewhere deep in the wreck.
		Choice@ok:
			Text: Get the Shearers ready. Cut into the core.
			Do: close

EmblemFound:
	When: found
	Item: emblem
	Title: The emblem
	Start: core
	Node@core:
		Say: The core opens on dust a finger deep, and on people still at their stations: skeletons in the same uniforms as yours. The surgeon kneels by one of them for a long time. "These aren't days old, Captain. Not years, either." The station's last log is dated. Nobody knows what today's date is.
		Choice@on:
			Text: What else is in there?
			Goto: radar
	Node@radar:
		Say: The station's long watch, intact: a sensor array the same make as the Forge's own. The watch officer looks at it, then down at the console, and their hands start to move before they do. The chart lights up. For the first time since you woke, you can see where you are.
		Choice@ok:
			Text: Then let's see it.
			Do: close

CoilsHere:
	When: arrive
	If: here relic coils, item coils missing
	Title: The Threadwound Coils
	Start: here
	Node@here:
		Say: The wreck is old, older than the Forge, and its drive section is still sealed. The engineers have their ears to the hull: a faint, steady hum, like a held note. Coils. Cut into the hulk with Shearers until they find the vault.
		Choice@ok:
			Text: Get the Shearers ready.
			Do: close

CoilsFound:
	When: found
	Item: coils
	Title: The Coils
	Start: found
	Node@found:
		Say: The vault opens on spools of thread-metal, still warm. The chief engineer picks one up and starts winding it before knowing why, then laughs for the first time since you woke. The Skein spools up deeper and steadier: the gap to the Middens is a stitch now.
		Choice@ok:
			Text: On to the Middens.
			Do: close

LensHere:
	When: arrive
	If: here relic lens, item lens missing
	Title: The Stillwater Lens
	Start: here
	Node@here:
		Say: Something in this wreck bends the light from the sensors, just slightly, the way water bends a stick. The Lens is in there.
		Choice@ok:
			Text: Cut it out.
			Do: close

LensFound:
	When: found
	Item: lens
	Title: The Lens
	Start: found
	Node@found:
		Say: It is not glass. It is not anything the engineers can name, but they set it into the drive as if they had done it a hundred times. Through it, the Veil on the star chart looks like what it is: a door. Behind it lies the Hush.
		Choice@ok:
			Text: Onward.
			Do: close

SpindleHere:
	When: arrive
	If: here relic spindle, item spindle missing
	Title: The Anchor Spindle
	Start: here
	Node@here:
		Say: The wreck's spine is one long, heavy core, and it does not drift like the rest of the wreck. It holds its place against everything. The Spindle.
		Choice@ok:
			Text: Cut it free.
			Do: close

SpindleFound:
	When: found
	Item: spindle
	Title: The Spindle
	Start: found
	Node@found:
		Say: Forty crew to move it, and it still does not want to move. It slides into the drive's spine with a sound everyone aboard seems to recognise. The Skein's longest stitch reaches the Shore now.
		Choice@ok:
			Text: Onward.
			Do: close

HeartstoneHere:
	When: arrive
	If: here relic heartstone, item heartstone missing
	Title: The Heartstone
	Start: here
	Node@here:
		Say: The wreck is warm. Not its reactor: the whole hull, evenly, like something alive. The Heartstone is aboard.
		Choice@ok:
			Text: Go and get it.
			Do: close

HeartstoneFound:
	When: found
	Item: heartstone
	Title: The heart of the drive
	Start: found
	Node@found:
		Say: A warm stone the size of a house. The old engineers' notes call it the drive's heart, and they are very sure about it. So, now, is everyone aboard. The drive is whole: from the Shore's edge, the Forge can make the final jump.
		Choice@ok:
			Text: Find the edge.
			Do: close

VeilFirst:
	When: arrive
	If: region Hush, not flag hush
	Title: The Hush
	Start: hush
	Node@hush:
		Say: The Veil closes behind the Forge like a curtain. The radio goes quiet, then quieter. Somebody on the bridge whispers, and then everyone does, without knowing why.
		Choice@ok:
			Text: Keep going.
			Do: flag hush, close

ShoreFirst:
	When: arrive
	If: region Shore, not flag shore
	Title: The Shore
	Start: shore
	Node@shore:
		Say: The scrap thins out. Past the last wrecks there is only dark, and in the dark, very faint, a star the navigators swear they recognise.
		Choice@ok:
			Text: That's the way.
			Do: flag shore, close

Ending:
	When: home
	Title: Home
	Start: jump
	Node@jump:
		Say: The Skein pulls tight, tighter than it ever has. The Wrack falls away behind the Forge: the shoals, the wrecks, the lantern-lit refineries, everyone you met and everyone you lost.
		Choice@on:
			Text: And then?
			Goto: home
	Node@home:
		Say: When the lights come back there are stars outside, and they are the right ones. Meridian is three days away. Someone on the bridge starts laughing, and doesn't stop for a long time.
		Choice@end:
			Text: Bring her in.
			Do: close

# Every life after the first opens here.
Waking:
	When: start
	If: life >= 2
	Title: Again
	Start: wake
	Node@wake:
		Say: White light, then the bridge. The same alarms, the same smell of hot brass, the same crew blinking at the same instruments, reading their names off their uniforms. You know this moment. You have been here before, and something in you remembers how it ended.
		Choice@again:
			Text: Again, then.
			Do: close
		Choice@chart:
			Text: Pull up the chart. We know more than we did.
			Do: morale 2, close
